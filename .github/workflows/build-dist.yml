name: Build dist

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://laasotunayiivssffhnu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhYXNvdHVuYXlpaXZzc2ZmaG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NDUzNDgsImV4cCI6MjA4NjAyMTM0OH0.b3dPEebr3J3o-l2OAZHHpSb13wj__S9XBPmj3Sa5Yy4

      - name: Commit dist back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dist -f
          git commit -m "CI: build dist" || echo "No changes"
          git push
