<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>অফলাইন - ইত্তেহাদ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, #1e3a5f 0%, #0f1f33 100%);
      color: #ffffff;
      text-align: center;
    }

    .offline-container {
      max-width: 400px;
      animation: fadeIn 0.5s ease-out;
    }

    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .offline-icon svg {
      width: 40px;
      height: 40px;
      opacity: 0.9;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    p {
      font-size: 0.95rem;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
      font-family: inherit;
    }

    .retry-btn:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-1px);
    }

    .retry-btn:active {
      transform: scale(0.97);
    }

    .info-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .info-card {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1rem 0.75rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .info-card .icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .info-card .label {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .info-card .value {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }

    .footer-text {
      margin-top: 3rem;
      font-size: 0.75rem;
      opacity: 0.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
        <line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>
    
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>আপনার ডিভাইসে এই মুহূর্তে ইন্টারনেট সংযোগ নেই। সংযোগ পুনরায় স্থাপন হলে আবার চেষ্টা করুন।</p>
    
    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      আবার চেষ্টা করুন
    </button>

    <div class="info-cards">
      <div class="info-card">
        <div class="icon">📞</div>
        <div class="label">যোগাযোগ</div>
        <div class="value">০১৭XX-XXXXXX</div>
      </div>
      <div class="info-card">
        <div class="icon">🕌</div>
        <div class="label">প্রতিষ্ঠান</div>
        <div class="value">ইত্তেহাদ</div>
      </div>
      <div class="info-card">
        <div class="icon">📍</div>
        <div class="label">অবস্থান</div>
        <div class="value">বাংলাদেশ</div>
      </div>
      <div class="info-card">
        <div class="icon pulse">🔴</div>
        <div class="label">স্ট্যাটাস</div>
        <div class="value">অফলাইন</div>
      </div>
    </div>

    <p class="footer-text">ইত্তেহাদুল মাদারিসিল খুসুসিয়্যাহ © ২০২৬</p>
  </div>
</body>
</html>
